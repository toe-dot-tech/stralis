name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # A real Redis lets the Streams integration suite (test_queue_redis.py) run
    # instead of skipping; MinIO is started as a step below because its image
    # needs the `server /data` command that service containers cannot pass.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Un-skips test_queue_redis.py.
      STRALIS_TEST_REDIS_URL: redis://localhost:6379/0
      # Un-skips test_storage_s3.py. The store creates the bucket lazily on
      # first write (S3ObjectStore.ensure_bucket), so no pre-provisioning here.
      STRALIS_TEST_S3_ENDPOINT_URL: http://localhost:9000
      STRALIS_TEST_S3_ACCESS_KEY: minio
      STRALIS_TEST_S3_SECRET_KEY: minio123
      STRALIS_TEST_S3_BUCKET: stralis-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready > /dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio >&2
          exit 1

      - name: Run tests (coverage)
        run: python -m pytest --cov=stralis --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  ui:
    name: Flutter UI (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Widget/unit tests
        run: flutter test
