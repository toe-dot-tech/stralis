[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stralis"
version = "0.1.0"
description = "Distributed media automation engine compiling multi-step pipelines into resilient, fault-tolerant DAGs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "redis>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
stralis = "stralis.cli:app"

[tool.setuptools.packages.find]
include = ["stralis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
