name: stralis_ui
description: Flutter UI for Stralis - distributed media automation engine
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/
